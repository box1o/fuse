basePath: /
definitions:
  deviceauthapi.CodeResponse:
    properties:
      device_code:
        type: string
      expires_in:
        type: integer
      interval:
        type: integer
      user_code:
        type: string
      verification_uri:
        type: string
      verification_uri_complete:
        type: string
    type: object
  deviceauthapi.CreateCodeRequest:
    properties:
      client_name:
        type: string
    type: object
  deviceauthapi.DecisionRequest:
    properties:
      user_code:
        type: string
    type: object
  deviceauthapi.DeviceRequest:
    properties:
      client_name:
        type: string
      expires_at:
        type: string
      status:
        type: string
      user_code:
        type: string
    type: object
  deviceauthapi.StatusResponse:
    properties:
      authenticated:
        type: boolean
      expires_at:
        type: string
      owner_email:
        type: string
      owner_id:
        type: string
      owner_name:
        type: string
    type: object
  deviceauthapi.TokenRequest:
    properties:
      device_code:
        type: string
    type: object
  deviceauthapi.TokenResponse:
    properties:
      access_token:
        type: string
      expires_at:
        type: string
      owner_email:
        type: string
      owner_id:
        type: string
      owner_name:
        type: string
      token_type:
        type: string
    type: object
  errors.HTTPError:
    properties:
      code:
        type: string
      detail:
        type: string
      message:
        type: string
    type: object
  fuse_internal_domain_compute.Capabilities:
    properties:
      cpu_cores:
        example: 8
        minimum: 1
        type: integer
      gpu_count:
        example: 1
        minimum: 0
        type: integer
      memory_mb:
        example: 16384
        minimum: 1
        type: integer
      npu_supported:
        example: false
        type: boolean
    type: object
  fuse_internal_domain_compute.Node:
    properties:
      capabilities:
        $ref: '#/definitions/fuse_internal_domain_compute.Capabilities'
      created_at:
        type: string
      id:
        type: string
      name:
        type: string
      owner_id:
        type: string
      status:
        $ref: '#/definitions/fuse_internal_domain_compute.NodeStatus'
      updated_at:
        type: string
      workspace_id:
        type: string
    type: object
  fuse_internal_domain_compute.NodeStatus:
    enum:
    - pending
    - online
    - offline
    - disabled
    type: string
    x-enum-varnames:
    - NodeStatusPending
    - NodeStatusOnline
    - NodeStatusOffline
    - NodeStatusDisabled
  interfaces_server_compute.CreateNodeRequest:
    properties:
      capabilities:
        $ref: '#/definitions/fuse_internal_domain_compute.Capabilities'
      name:
        example: development-node
        type: string
      workspace_id:
        example: 9f99eadd-7206-45ad-b284-8031019c39bc
        type: string
    type: object
  interfaces_server_compute.RenameNodeRequest:
    properties:
      name:
        example: production-node
        type: string
    type: object
  interfaces_server_compute.UpdateNodeCapabilitiesRequest:
    properties:
      capabilities:
        $ref: '#/definitions/fuse_internal_domain_compute.Capabilities'
    type: object
  interfaces_server_compute.UpdateNodeStatusRequest:
    properties:
      status:
        allOf:
        - $ref: '#/definitions/fuse_internal_domain_compute.NodeStatus'
        enum:
        - pending
        - online
        - offline
        - disabled
        example: online
    type: object
  interfaces_server_health.HealthResponse:
    properties:
      services:
        additionalProperties:
          type: string
        type: object
      status:
        type: string
      timestamp:
        type: string
      uptime:
        type: string
      version:
        type: string
    type: object
  interfaces_server_mail.SendIssueRequest:
    properties:
      body:
        type: string
      subject:
        type: string
      to:
        type: string
    type: object
  interfaces_server_payment.CreateCheckoutRequest:
    properties:
      cancel_url:
        type: string
      credit_pack_id:
        type: string
      success_url:
        type: string
    type: object
  interfaces_server_payment.CreateCheckoutResponse:
    properties:
      payment_id:
        type: string
      session_id:
        type: string
      url:
        type: string
    type: object
  interfaces_server_workspace.AddWorkspaceMemberRequest:
    properties:
      user_mail:
        type: string
    type: object
  interfaces_server_workspace.CreateWorkspaceRequest:
    properties:
      name:
        type: string
    type: object
info:
  contact: {}
  description: API documentation for the Fuse service.
  title: Fuse API
  version: 1.0.0
paths:
  /auth/{provider}:
    get:
      description: Redirects the client to the selected OAuth provider.
      parameters:
      - description: OAuth provider
        in: path
        name: provider
        required: true
        type: string
      responses:
        "302":
          description: Found
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errors.HTTPError'
      summary: Start OAuth authentication
      tags:
      - authentication
  /auth/{provider}/callback:
    get:
      description: Processes the OAuth callback, sets the session cookie, and redirects
        to the frontend.
      parameters:
      - description: OAuth provider
        in: path
        name: provider
        required: true
        type: string
      responses:
        "302":
          description: Found
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errors.HTTPError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/errors.HTTPError'
      summary: Complete OAuth authentication
      tags:
      - authentication
  /auth/cli/logout:
    post:
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/errors.HTTPError'
      security:
      - BearerAuth: []
      summary: Revoke a CLI credential
      tags:
      - CLI authentication
  /auth/cli/status:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/deviceauthapi.StatusResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/errors.HTTPError'
      security:
      - BearerAuth: []
      summary: Get CLI authentication status
      tags:
      - CLI authentication
  /auth/device/approve:
    post:
      consumes:
      - application/json
      parameters:
      - description: One-time user code
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/deviceauthapi.DecisionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/errors.HTTPError'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/errors.HTTPError'
        "410":
          description: Gone
          schema:
            $ref: '#/definitions/errors.HTTPError'
      summary: Approve a CLI device request
      tags:
      - CLI authentication
  /auth/device/code:
    post:
      consumes:
      - application/json
      parameters:
      - description: CLI client details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/deviceauthapi.CreateCodeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/deviceauthapi.CodeResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errors.HTTPError'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/errors.HTTPError'
      summary: Create a CLI device code
      tags:
      - CLI authentication
  /auth/device/deny:
    post:
      consumes:
      - application/json
      parameters:
      - description: One-time user code
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/deviceauthapi.DecisionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/errors.HTTPError'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/errors.HTTPError'
        "410":
          description: Gone
          schema:
            $ref: '#/definitions/errors.HTTPError'
      summary: Deny a CLI device request
      tags:
      - CLI authentication
  /auth/device/request/{userCode}:
    get:
      parameters:
      - description: One-time user code
        in: path
        name: userCode
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/deviceauthapi.DeviceRequest'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/errors.HTTPError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/errors.HTTPError'
      summary: Inspect a CLI device request
      tags:
      - CLI authentication
  /auth/device/token:
    post:
      consumes:
      - application/json
      parameters:
      - description: Device code
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/deviceauthapi.TokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/deviceauthapi.TokenResponse'
        "202":
          description: Accepted
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "410":
          description: Gone
          schema:
            additionalProperties:
              type: string
            type: object
        "429":
          description: Too Many Requests
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Exchange a CLI device code
      tags:
      - CLI authentication
  /auth/logout:
    post:
      description: Deletes the current session and clears its cookie.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/errors.HTTPError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/errors.HTTPError'
      summary: End the current session
      tags:
      - authentication
  /auth/status:
    get:
      description: Returns the user associated with the current session cookie.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/errors.HTTPError'
      summary: Get the authenticated user
      tags:
      - authentication
  /compute/node:
    get:
      description: Returns all compute nodes owned by the authenticated user.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/fuse_internal_domain_compute.Node'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/errors.HTTPError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/errors.HTTPError'
      summary: List owned compute nodes
      tags:
      - compute
    post:
      consumes:
      - application/json
      description: Creates a compute node owned by the authenticated user.
      parameters:
      - description: Compute node details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/interfaces_server_compute.CreateNodeRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/fuse_internal_domain_compute.Node'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errors.HTTPError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/errors.HTTPError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/errors.HTTPError'
      summary: Create compute node
      tags:
      - compute
  /compute/node/{nodeID}:
    delete:
      description: Permanently deletes a compute node owned by the authenticated user.
      parameters:
      - description: Compute node ID
        format: uuid
        in: path
        name: nodeID
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errors.HTTPError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/errors.HTTPError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/errors.HTTPError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/errors.HTTPError'
      summary: Delete compute node
      tags:
      - compute
    get:
      description: Returns a compute node owned by the authenticated user.
      parameters:
      - description: Compute node ID
        format: uuid
        in: path
        name: nodeID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/fuse_internal_domain_compute.Node'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errors.HTTPError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/errors.HTTPError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/errors.HTTPError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/errors.HTTPError'
      summary: Get compute node
      tags:
      - compute
  /compute/node/{nodeID}/capabilities:
    patch:
      consumes:
      - application/json
      description: Changes the hardware capabilities of a compute node owned by the
        authenticated user.
      parameters:
      - description: Compute node ID
        format: uuid
        in: path
        name: nodeID
        required: true
        type: string
      - description: New compute node capabilities
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/interfaces_server_compute.UpdateNodeCapabilitiesRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/fuse_internal_domain_compute.Node'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errors.HTTPError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/errors.HTTPError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/errors.HTTPError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/errors.HTTPError'
      summary: Update compute node capabilities
      tags:
      - compute
  /compute/node/{nodeID}/name:
    patch:
      consumes:
      - application/json
      description: Changes the name of a compute node owned by the authenticated user.
      parameters:
      - description: Compute node ID
        format: uuid
        in: path
        name: nodeID
        required: true
        type: string
      - description: New compute node name
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/interfaces_server_compute.RenameNodeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/fuse_internal_domain_compute.Node'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errors.HTTPError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/errors.HTTPError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/errors.HTTPError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/errors.HTTPError'
      summary: Rename compute node
      tags:
      - compute
  /compute/node/{nodeID}/status:
    patch:
      consumes:
      - application/json
      description: Changes the status of a compute node owned by the authenticated
        user.
      parameters:
      - description: Compute node ID
        format: uuid
        in: path
        name: nodeID
        required: true
        type: string
      - description: New compute node status
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/interfaces_server_compute.UpdateNodeStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/fuse_internal_domain_compute.Node'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errors.HTTPError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/errors.HTTPError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/errors.HTTPError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/errors.HTTPError'
      summary: Update compute node status
      tags:
      - compute
  /compute/node/workspace/{workspaceID}:
    get:
      description: Returns compute nodes in a workspace that are owned by the authenticated
        user.
      parameters:
      - description: Workspace ID
        format: uuid
        in: path
        name: workspaceID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/fuse_internal_domain_compute.Node'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errors.HTTPError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/errors.HTTPError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/errors.HTTPError'
      summary: List workspace compute nodes
      tags:
      - compute
  /health:
    get:
      consumes:
      - application/json
      description: Get application health status
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/interfaces_server_health.HealthResponse'
      summary: Health Check
      tags:
      - health
  /mail:
    post:
      consumes:
      - application/json
      description: Sends an issue report to the requested recipient.
      parameters:
      - description: Email details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/interfaces_server_mail.SendIssueRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Send an issue email
      tags:
      - mail
  /payments/checkout:
    post:
      consumes:
      - application/json
      description: Creates a Stripe checkout session for the selected credit pack.
      parameters:
      - description: Checkout details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/interfaces_server_payment.CreateCheckoutRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/interfaces_server_payment.CreateCheckoutResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errors.HTTPError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/errors.HTTPError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/errors.HTTPError'
      summary: Create a payment checkout session
      tags:
      - payments
  /payments/webhook:
    post:
      consumes:
      - application/json
      description: Processes an incoming Stripe webhook event for payment updates.
      parameters:
      - description: Stripe signature
        in: header
        name: Stripe-Signature
        required: true
        type: string
      - description: Stripe webhook payload
        in: body
        name: request
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errors.HTTPError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/errors.HTTPError'
      summary: Handle Stripe webhook
      tags:
      - payments
  /settings:
    get:
      description: Returns settings available to the authenticated user.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get application settings
      tags:
      - settings
  /uptime:
    get:
      consumes:
      - application/json
      description: Get application uptime
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Uptime Check
      tags:
      - health
  /workspaces:
    get:
      description: Returns every workspace owned by the authenticated user.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              additionalProperties: true
              type: object
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/errors.HTTPError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/errors.HTTPError'
      summary: List owned workspaces
      tags:
      - workspaces
    post:
      consumes:
      - application/json
      description: Creates a workspace owned by the authenticated user.
      parameters:
      - description: Workspace details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/interfaces_server_workspace.CreateWorkspaceRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errors.HTTPError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/errors.HTTPError'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/errors.HTTPError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/errors.HTTPError'
      summary: Create a workspace
      tags:
      - workspaces
  /workspaces/{workspaceID}:
    delete:
      description: Deletes the workspace identified by its ID.
      parameters:
      - description: Workspace ID
        in: path
        name: workspaceID
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errors.HTTPError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/errors.HTTPError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/errors.HTTPError'
      summary: Delete a workspace
      tags:
      - workspaces
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
