name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./...

      - name: Run static analysis
        run: go vet ./...

      - name: Build Docker image
        run: docker build --file Dockerfile --tag fuse:ci .

      - name: Build Fuse CLI release archives
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist
          for arch in amd64 arm64; do
            mkdir -p "dist/$arch"
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build \
              -buildvcs=false \
              -trimpath \
              -ldflags="-s -w -X fuse/cli/internal/commands.Version=ci" \
              -o "dist/$arch/fuse" \
              ./cli/cmd/fuse
            tar -C "dist/$arch" -czf "dist/$arch.tar.gz" fuse
            test "$(tar -tzf "dist/$arch.tar.gz")" = "fuse"
          done
          file dist/amd64/fuse | grep -q "x86-64"
          file dist/arm64/fuse | grep -q "ARM aarch64"
          dist/amd64/fuse --version

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Build frontend
        working-directory: web
        run: bun run build
